<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>yongbok.cyworld — 이용복님의 미니홈피</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family:'Dotum','돋움',system-ui,'Apple SD Gothic Neo',sans-serif;
  background:#8a8a8a;
  background-image:linear-gradient(#7d7d7d 1px,transparent 1px),linear-gradient(90deg,#7d7d7d 1px,transparent 1px);
  background-size:22px 22px; min-height:100vh;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:20px 320px 20px 20px; font-size:12px; color:#333; min-width:1300px; overflow-x:auto;
}
/* 주소창 */
.addr-bar {
  width:880px; background:#fff; border:1px solid #9bbdd6;
  border-radius:20px; padding:7px 18px; margin-bottom:12px;
  font-size:12px; color:#555; display:flex; align-items:center; gap:8px;
}
.addr-bar .lock{color:#4a9fd4;}
.addr-bar b{color:#1d5c86;}

/* 바깥 파란 다이어리 커버 */
.outer {
  width:880px; background:#6bbde8;
  border:2px solid #2a7fb0; border-radius:26px; padding:20px 18px;
  position:relative;
  box-shadow:0 10px 26px rgba(0,0,0,.45), inset 0 0 0 3px #8fd0f2;
}
/* 다이어리 속지(두 페이지) */
.inner {
  background:transparent; border:none; border-radius:12px;
  display:flex; min-height:460px; max-height:580px; position:relative; gap:0;
}
/* 스프링 제본 */
.rings {
  width:30px; flex-shrink:0; display:flex; flex-direction:column;
  justify-content:space-around; align-items:center; padding:30px 0; z-index:3;
}
.rings span{
  display:block; width:26px; height:12px; border:3px solid #cfcfcf;
  border-radius:7px; background:linear-gradient(#f5f5f5,#9c9c9c);
  box-shadow:0 1px 2px rgba(0,0,0,.4);
}

/* 좌측 페이지 */
.left {
  width:218px; flex-shrink:0; padding:16px 14px;
  display:flex; flex-direction:column;
  background:#fff; border-radius:12px 4px 4px 12px;
  box-shadow:2px 2px 6px rgba(0,0,0,.25);
}
.counter { font-size:12px; color:#444; margin-bottom:10px; letter-spacing:.5px; }
.counter .t{color:#e8403a; font-weight:bold;}
.counter .tot{font-weight:bold;}
.photo-frame {
  border:2px solid #555; padding:3px; background:#fff;
}
.photo-frame img{width:100%; display:block;}
.today-box {
  border:2px solid #555; margin-top:10px; padding:7px 9px; font-size:12px; color:#555;
}
.today-box .emo{color:#e8a03a;}
.ilchon { margin-top:12px; color:#777; font-size:12px; }
.history { margin-top:10px; border-top:1px solid #999; padding-top:8px; font-size:13px; }
.history .arrow{color:#e8403a;}

/* 중앙 */
.center {
  flex:1; padding:16px 20px; display:flex; flex-direction:column; min-width:0; overflow-y:auto;
  background:#fff; border-radius:4px 12px 12px 4px;
  box-shadow:2px 2px 6px rgba(0,0,0,.25);
}
.main-title {
  font-size:21px; color:#555; padding-bottom:8px; border-bottom:2px solid #555;
  margin-bottom:12px; font-weight:bold;
}
.sec-title { color:#2a8fd4; font-size:14px; font-weight:bold; margin-bottom:6px; }
.sec-title .mini{float:right; font-size:12px;}
hr.thin{border:none; border-top:1px solid #aaa; margin:4px 0 8px;}

.center-top { display:flex; gap:20px; }
.updates { flex:1; min-width:0; }
.updates .u-line{ margin:4px 0; color:#555; }
.updates .cat{font-weight:bold;}
.updates .scrap{color:#e8403a; font-weight:bold;}
.stats { width:150px; flex-shrink:0; font-size:12px; }
.stats .row{ display:flex; justify-content:space-between; padding:3px 0; color:#555;}
.stats .row b{color:#2a8fd4;}

.miniroom { margin-top:12px; }
.miniroom img{ width:100%; max-height:250px; object-fit:cover; object-position:left top; border:1px solid #999; display:block; }
.friends { margin-top:auto; padding-top:10px; font-size:12px; color:#555; }
.friends b{ color:#2a8fd4; }

/* 콘텐츠 페이지 공용 */
.page-title{ font-size:17px; color:#2a8fd4; font-weight:bold; border-bottom:2px solid #7fb2d6; padding-bottom:7px; margin-bottom:12px;}
.diary-entry { border-bottom:1px dashed #ddd; padding:10px 2px; }
.diary-entry .d-date{ color:#e8403a; font-weight:bold; font-size:11px;}
.diary-entry .d-text{ margin-top:5px; line-height:1.7;}
.diary-entry .d-weather{ color:#999; font-size:11px; margin-top:3px;}

table.board{ width:100%; border-collapse:collapse; font-size:12px;}
table.board th{ background:#eaf4fb; color:#1d5c86; padding:7px 5px; border-top:2px solid #7fb2d6; border-bottom:1px solid #cde4f2;}
table.board td{ padding:8px 5px; border-bottom:1px solid #eef6fb; text-align:center;}
table.board td.subj{ text-align:left; cursor:pointer;}
table.board td.subj:hover{ color:#e8403a; text-decoration:underline;}
.new-badge{ color:#e8403a; font-size:10px; font-weight:bold;}

.photo-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:12px;}
.photo-item{ border:1px solid #d7e8f3; border-radius:4px; overflow:hidden; background:#f7fbfe;}
.photo-item .ph{ height:100px; display:flex; align-items:center; justify-content:center; font-size:40px;}
.photo-item .cap{ font-size:11px; padding:6px 8px; text-align:center; color:#555;}

.gb-form{ display:flex; flex-direction:column; gap:7px; margin-bottom:14px;}
.gb-form input,.gb-form textarea{ border:1px solid #bfddf0; padding:7px; font-size:12px; font-family:inherit; resize:vertical;}
.gb-form button{ align-self:flex-end; background:#2a8fd4; color:#fff; border:none; padding:6px 20px; font-weight:bold; cursor:pointer; font-size:12px;}
.gb-form button:hover{ background:#1d6ba3;}
.gb-entry{ background:#fffdf5; border:1px solid #f3e9c8; padding:9px 11px; margin-bottom:9px;}
.gb-entry .gb-head{ font-size:11px; color:#999; margin-bottom:4px;}
.gb-entry .gb-head b{ color:#1d5c86; font-size:12px;}
.gb-entry .gb-msg{ line-height:1.6;}

/* 우측 탭 */
.tabs {
  position:absolute; left:100%; top:70px; margin-left:-2px;
  display:flex; flex-direction:column; gap:6px; z-index:5;
}
.tab {
  background:#aed4ee; color:#fff; font-weight:bold; font-size:12px;
  padding:8px 12px 8px 14px; min-width:72px; text-align:center;
  border-radius:0 10px 10px 0; border:2px solid #2a7fb0; border-left:none;
  cursor:pointer; text-shadow:1px 1px 0 rgba(0,0,0,.12);
  box-shadow:2px 2px 4px rgba(0,0,0,.3);
}
.tab:hover{ background:#8fc4e8; }
.tab.active{ background:#fff; color:#222; text-shadow:none; }

/* 가로형 고정 레이아웃 — 세로로 접히지 않음 */

/* ===== 모바일 세로 버전 ===== */
@media (max-width: 860px){
  body{
    min-width:0; overflow-x:hidden;
    padding:14px 10px 40px;
    justify-content:flex-start;
  }
  .addr-bar{ width:94vw; font-size:11px; }
  .outer{
    width:94vw; padding:14px 12px;
    border-radius:22px;
  }
  .inner{
    flex-direction:column; max-height:none; min-height:0;
  }
  .rings{
    position:absolute; right:-4px; top:40px; bottom:40px;
    width:26px; padding:20px 0; z-index:4;
  }
  .rings span{ width:22px; height:10px; }
  .left{
    width:100%; border-radius:10px; margin-bottom:14px;
    box-shadow:2px 2px 6px rgba(0,0,0,.25);
  }
  .center{
    width:100%; border-radius:10px;
    max-height:none; overflow-y:visible;
  }
  /* 오른쪽 인덱스(세로 탭) — 사진처럼 */
  .tabs{
    position:absolute; left:100%; top:34px; margin-left:-2px;
    flex-direction:column; gap:6px; z-index:5;
  }
  .tab{
    border-radius:0 9px 9px 0; border-left:none;
    min-width:52px; padding:7px 8px; font-size:11px;
  }
  /* 인덱스 공간 확보 + 전체 프로필 축소 */
  .outer{ width:82vw; margin-right:12vw; padding:12px 10px; }
  .addr-bar{ width:82vw; margin-right:12vw; }
  .left{ padding:12px 10px; }
  .left .photo-frame img{ max-height:180px; object-fit:cover; }
  .center{ padding:12px 12px; font-size:11px; }
  .rings{ display:none; }
  .nateon{
    width:66vw; max-width:300px; right:4px; top:auto; bottom:10px; transform:none;
    font-size:12px;
  }
  .n-chat{
    width:72vw !important; max-width:320px; right:4px !important; left:auto !important;
    top:auto !important; bottom:10px !important; transform:none !important;
  }
}

</style>
<style>
.friends .link{ color:#2a8fd4; cursor:pointer; text-decoration:underline; }
.back-link{ font-size:12px; color:#777; cursor:pointer; margin-bottom:8px; }
.back-link:hover{ color:#e8403a; }
.pw-box{ display:flex; flex-direction:column; align-items:center; justify-content:center; flex:1; gap:12px; }
.pw-box .lock-ico{ font-size:40px; }
.pw-box input{ border:2px solid #7fb2d6; padding:8px 12px; font-size:16px; text-align:center; letter-spacing:6px; width:140px; }
.pw-box button{ background:#2a8fd4; color:#fff; border:none; padding:7px 26px; font-weight:bold; cursor:pointer; }
.pw-box .hint{ color:#999; font-size:11px; }
.photo-item img{ width:100%; display:block; }
.ilpyeong{ margin-top:10px; font-size:12px; color:#555; }
.ilpyeong b{ color:#e8403a; }
.owner-box{ margin-top:auto; }
.owner-tabs{ display:flex; border:1px solid #bbb; border-radius:4px; overflow:hidden; font-size:11px; margin-bottom:8px; }
.owner-tabs span{ flex:1; text-align:center; padding:5px 0; cursor:pointer; background:#f2f2f2; color:#777; }
.owner-tabs span.on{ background:#ff9a2a; color:#fff; font-weight:bold; }
.ilchon-wave{ border:1px solid #bbb; border-radius:4px; padding:6px 8px; font-size:11px; color:#555; background:#fffdf3; }
.ilchon-wave .star{ color:#f5b000; }
.gb-form .write-btn{ align-self:flex-end; background:#2a8fd4; color:#fff; border:none; padding:6px 20px; font-weight:bold; cursor:pointer; font-size:12px; }
.login-overlay{ position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; z-index:50; }
.login-win{ width:320px; background:#fff; border:2px solid #2a7fb0; border-radius:8px; overflow:hidden; box-shadow:0 8px 24px rgba(0,0,0,.4); }
.login-win .bar{ background:#6bbde8; color:#fff; font-weight:bold; padding:8px 12px; font-size:13px; }
.login-win .body{ padding:18px 20px; display:flex; flex-direction:column; gap:9px; }
.login-win input{ border:1px solid #bfddf0; padding:8px; font-size:12px; }
.login-win .btns{ display:flex; gap:8px; margin-top:4px; }
.login-win .btns button{ flex:1; padding:8px 0; font-weight:bold; cursor:pointer; border:none; font-size:12px; }
.login-win .btn-login{ background:#2a8fd4; color:#fff; }
.login-win .btn-back{ background:#eee; color:#555; }

/* 네이트온 창 */
.n-chat{ position:fixed; right:330px; top:50%; transform:translateY(-50%); z-index:10000;
  width:280px; background:#eef5fb; border:1px solid #7fa8c9; border-radius:8px; overflow:hidden;
  box-shadow:0 8px 24px rgba(0,0,0,.4); font-size:12px; }
.n-chat .n-bar{ background:linear-gradient(#fdfdfd,#d7e6f2); padding:6px 9px; display:flex; align-items:center; gap:6px; border-bottom:1px solid #b9d2e6;}
.n-chat .n-bar .x{ margin-left:auto; cursor:pointer; color:#888; font-weight:bold; padding:0 3px;}
.n-chat .c-body{ height:180px; overflow-y:auto; padding:10px; background:#fff; display:flex; flex-direction:column; gap:6px;}
.n-chat .c-msg b{ display:block; font-size:10px; color:#777; margin-bottom:1px;}
.n-chat .c-msg span{ display:inline-block; padding:5px 9px; border-radius:10px; max-width:200px; word-break:break-all;}
.n-chat .c-msg.them span{ background:#e8f1f9; border:1px solid #cadeee;}
.n-chat .c-msg.me{ text-align:right;}
.n-chat .c-msg.me span{ background:#fff3c4; border:1px solid #ecd98a;}
.n-chat .c-choices{ display:flex; gap:6px; padding:8px; background:#e3eef7; justify-content:center;}
.n-chat .c-choices button{ background:#fff; border:1px solid #7fa8c9; border-radius:12px; padding:6px 14px; cursor:pointer; font-size:12px; color:#1d5c86;}
.n-chat .c-choices button:hover{ background:#d8ebfa;}
.n-chat .c-msg .tm{ font-style:normal; font-size:9px; color:#aaa; margin:0 4px;}
.n-chat .c-input{ display:flex; gap:5px; padding:7px; background:#e3eef7;}
.n-chat .c-input input{ flex:1; border:1px solid #a9cbe4; border-radius:4px; padding:5px 7px; font-size:12px;}
.n-chat .c-input button{ background:#4a9ad4; color:#fff; border:none; border-radius:4px; padding:5px 10px; cursor:pointer; font-size:12px;}
.nateon{ position:fixed; right:14px; top:50%; transform:translateY(-50%); z-index:9999;
  width:300px; background:#eef4fa; border:1px solid #7aa8cc; border-radius:6px;
  box-shadow:4px 6px 18px rgba(0,0,0,.45); font-size:13px; overflow:hidden;
  animation:nate-in .4s ease-out; }
@keyframes nate-in{ from{opacity:0; transform:translateY(-50%) translateX(-30px);} to{opacity:1; transform:translateY(-50%);} }
.nateon .n-bar{ background:linear-gradient(#fdfdfd,#d7e6f2); padding:6px 9px; display:flex; align-items:center; gap:6px;
  border-bottom:1px solid #b8d0e4; }
.nateon .n-bar b{ color:#e8403a; font-size:14px; }
.nateon .n-bar .x{ margin-left:auto; cursor:pointer; color:#888; font-weight:bold; padding:0 3px; }
.nateon .n-bar .x:hover{ color:#e8403a; }
.nateon .n-me{ background:#fff; padding:8px 9px; display:flex; gap:8px; align-items:center; border-bottom:1px solid #dde9f3; }
.nateon .n-me .ava{ width:44px; height:44px; border-radius:4px; background:#cfe4f5; display:flex; align-items:center; justify-content:center; font-size:20px; border:1px solid #a9cbe4; }
.nateon .n-me .nick b{ color:#1d5c86; font-size:14px; }
.nateon .n-me .nick .st{ color:#999; font-size:11px; }
.nateon .n-sec{ background:#e3eef7; color:#2a6a99; font-weight:bold; padding:4px 9px; }
.nateon ul{ list-style:none; background:#fff; }
.nateon li{ padding:7px 11px; display:flex; align-items:center; gap:7px; border-bottom:1px solid #f0f6fa; }
.nateon li .dot{ width:8px; height:8px; border-radius:50%; background:#58c322; flex-shrink:0; }
.nateon li .dot.off{ background:#ccc; }
.nateon li .msgline{ color:#999; font-size:11px; }
.nateon .n-alert{ background:#fffbe3; border-top:1px solid #f0e2a0; padding:8px 9px; display:none; }
.nateon .n-alert.show{ display:block; animation:nate-in .3s ease-out; }
.nateon .n-alert b{ color:#e8403a; }
.nateon .n-foot{ background:#d7e6f2; padding:6px 10px; color:#777; font-size:11px; display:flex; align-items:center; gap:4px; }
</style>
</head>

function addGb(){
  const name=document.getElementById('gb-name').value.trim()||'익명';
  const msg=document.getElementById('gb-msg').value.trim();
  if(!msg){alert('내용을 입력해주세요!');return;}
  const list=loadGb(); const d=new Date();
  list.unshift({name,msg,date:`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`});
  try{localStorage.setItem('cyworld_gb_yongbok_v3',JSON.stringify(list));}catch(e){}
  renderGuest();
}
